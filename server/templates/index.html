<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Projekt grupowy</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { height: 100vh; width: 100vw; margin: 0; padding: 0; overflow: hidden; background: #333; }
        #map { width: 100%; height: 100%; display: block; z-index: 1; }

        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #3498db;
            padding: 12px 18px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            flex-grow: 1;
            text-align: center;
        }

        .btn.active { background: #3498db; color: white; border-color: #2980b9; }

        .btn-auto { 
            background: #2ecc71; 
            border-color: #27ae60; 
            color: white; 
            min-width: 100px;
        }
        .btn-auto.off { background: #95a5a6; border-color: #7f8c8d; }

        .info-panel {
            position: absolute;
            bottom: 20px;
            right: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 10px;
            font-family: sans-serif;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
            border-left: 5px solid #3498db;
            pointer-events: none;
        }

        #current-floor { font-weight: bold; color: #2980b9; }

        @media (min-width: 768px) {
            .controls {
                flex-direction: column;
                width: 150px;
                right: auto;
            }
            .info-panel {
                bottom: auto;
                top: 20px;
                left: auto;
                width: auto;
                min-width: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn active" onclick="handleMapChange(this, 'pietro3')">Piętro 3</button>
        <button class="btn" onclick="handleMapChange(this, 'pietro4')">Piętro 4</button>
        <button class="btn" onclick="handleMapChange(this, 'pietro5')">Piętro 5</button>
        <button id="autoBtn" class="btn btn-auto" onclick="toggleAuto()">Znajdź: ON</button>
    </div>

    <div class="info-panel">
        <div><b>Lokalizacja:</b> <span id="current-floor">Piętro 3</span></div>
        <small id="last-update">Oczekiwanie na dane...</small>
    </div>

    <div id="map"></div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- KONFIGURACJA MAP ---
        const mapConfigs = {
            'pietro3': { name: 'Piętro 3', url: '/static/pietro3.png', bounds: [[0, 0], [3307, 4677]] },
            'pietro4': { name: 'Piętro 4', url: '/static/pietro4.png', bounds: [[0, 0], [3307, 4677]] },
            'pietro5': { name: 'Piętro 5', url: '/static/pietro5.png', bounds: [[0, 0], [3307, 4677]] }
        };

        // --- KONFIGURACJA PUNKTÓW ODBIORNIKÓW ---
        const pointsConfig = {
            'pietro3': {
                "3p01": [492, 1755], "3p02": [492, 1690], "3p03": [492, 1625], "3p04": [492, 1560], "3p05": [492, 1465],
                "3p06": [492, 1430], "3p07": [492, 1365], "3p08": [492, 1300], "3p09": [492, 1235], "3p10": [492, 1172],
                "3p11": [492, 1106], "3p12": [492, 1040], "3p13": [492, 975], "3p14": [492, 910], "3p15": [492, 846],
                "3p16": [492, 780], "3p17": [492, 714], "3p18": [554, 714], "3p19": [600, 714], "3p20": [646, 714],
                "3p21": [492, 652], "3p22": [492, 586]
            },
            'pietro4': {
                "4p01": [1290, 4118], "4p02": [1290, 4055], "4p03": [1290, 3992], "4p04": [1290, 3929], "4p05": [1290, 3866],
                "4p06": [1290, 3803], "4p07": [1290, 3740], "4p08": [1290, 3677], "4p09": [1290, 3614], "4p10": [1290, 3551],
                "4p11": [1290, 3487], "4p12": [1290, 3425], "4p13": [1290, 3362], "4p14": [1290, 3299], "4p15": [1290, 3236],
                "4p16": [1290, 3174], "4p17": [1290, 3110], "4p18": [1290, 3047], "4p19": [1290, 2984], "4p20": [1290, 2921],
                "4p21": [1290, 2859], "4p22": [1290, 2795], "4p23": [1290, 2732], "4p24": [1290, 2669], "4p25": [1290, 2607],
                "4p26": [1290, 2543], "4p27": [1290, 2480], "4p28": [1290, 2417], "4p29": [1290, 2354], "4p30": [1290, 2291],
                "4p31": [1290, 2228], "4p32": [1290, 2165], "4p33": [1290, 2102], "4p34": [1290, 2038], "4p35": [1290, 1977],
                "4p36": [1290, 1913], "4p37": [1290, 1851], "4p38": [1290, 1787], "4p39": [1290, 1724], "4p40": [1290, 1661],
                "4p41": [1290, 1598], "4p42": [1290, 1536], "4p43": [1290, 1473], "4p44": [1290, 1410], "4p45": [1290, 1347],
                "4p46": [1290, 1284], "4p47": [1290, 1221], "4p48": [1290, 1158], "4p49": [1290, 1095], "4p50": [1290, 1032],
                "4p51": [1290, 969], "4p52": [1290, 905], "4p53": [1290, 842], "4p54": [1290, 780], "4p55": [1290, 1290],
                "4p56": [1290, 653], "4p57": [1290, 591], "4p58": [1290, 527], "4p59": [1370, 3057], "4p60": [1449, 3057],
                "4p61": [1370, 2921], "4p62": [1370, 2859], "4p63": [1370, 2795], "4p64": [1370, 2732], "4p65": [1449, 2921],
                "4p66": [1449, 2859], "4p67": [1449, 2795], "4p68": [1449, 2732], "4p69": [1362, 1380], "4p70": [1423, 1380],
                "4p71": [1483, 1366], "4p72": [1549, 1353], "4p73": [1612, 1353], "4p74": [1672, 1353], "4p75": [1738, 1353],
                "4p76": [1801, 1353], "4p77": [1863, 1353]
            },
            'pietro5': { "50": [500, 500], "51": [200, 800] }
        };

        let currentFloorId = 'pietro3';
        let autoSwitch = true;
        let deviceMarkers = {};

        var map = L.map('map', { 
            crs: L.CRS.Simple, 
            minZoom: -1,
            attributionControl: false,
            zoomSnap: 0.1,
            zoomControl: false
        });
        
        var imageOverlay = L.imageOverlay('', mapConfigs[currentFloorId].bounds).addTo(map);

        function handleMapChange(btnElement, floorId) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            changeMap(floorId);
        }

        function changeMap(floorId) {
            if (!mapConfigs[floorId]) return;
            currentFloorId = floorId;
            const config = mapConfigs[floorId];

            imageOverlay.setUrl(config.url);
            imageOverlay.setBounds(config.bounds);
            map.setMaxBounds(config.bounds);
            map.fitBounds(config.bounds);

            document.getElementById('current-floor').innerText = config.name;
            
            Object.keys(deviceMarkers).forEach(deviceID => {
                const marker = deviceMarkers[deviceID];
                if (marker.floorOwner === currentFloorId) {
                    marker.addTo(map);
                } else {
                    map.removeLayer(marker);
                }
            });

            setTimeout(() => map.invalidateSize(), 200);
        }

        function toggleAuto() {
            autoSwitch = !autoSwitch;
            const btn = document.getElementById('autoBtn');
            btn.innerText = autoSwitch ? "Znajdź: ON" : "Znajdź: OFF";
            btn.classList.toggle('off', !autoSwitch);
        }

        function getPointData(pointID) {
            for (const floor in pointsConfig) {
                if (pointsConfig[floor][pointID]) {
                    return { floor: floor, coords: pointsConfig[floor][pointID] };
                }
            }
            return null;
        }

        changeMap('pietro3');

        // --- OBSŁUGA DANYCH LIVE (SOCKET.IO) ---
	const socket = io();
        socket.on('update_map', function(dataList) {
            let pointsOccupancy = {};

            dataList.forEach(item => {
                const pointData = getPointData(item.punkt);
                if (pointData) {
                    if (autoSwitch && pointData.floor !== currentFloorId) {
                        const targetBtn = Array.from(document.querySelectorAll('.btn'))
                                              .find(b => b.innerText.trim() === mapConfigs[pointData.floor].name.trim());
                        if (targetBtn) {
                            handleMapChange(targetBtn, pointData.floor);
                        }
                    }

                    const deviceID = item.id_raspberyy;
                    const pointKey = `${pointData.floor}_${item.punkt}`;

                    if (!pointsOccupancy[pointKey]) {
                        pointsOccupancy[pointKey] = 0;
                    }
                    
                    const yOffset = pointsOccupancy[pointKey] * 40; 
                    const adjustedCoords = [pointData.coords[0] + yOffset, pointData.coords[1]];
                    
                    pointsOccupancy[pointKey]++;

                    if (!deviceMarkers[deviceID]) {
                        deviceMarkers[deviceID] = L.circleMarker(adjustedCoords, {
                            color: '#e74c3c', radius: 10, weight: 2, fillOpacity: 0.9
                        });
                        deviceMarkers[deviceID].bindTooltip(deviceID, { permanent: true, direction: 'top' });
                    }

                    deviceMarkers[deviceID].floorOwner = pointData.floor;

                    if (pointData.floor === currentFloorId) {
                        deviceMarkers[deviceID].addTo(map).setLatLng(adjustedCoords);
                    } else {
                        map.removeLayer(deviceMarkers[deviceID]);
                    }
                    
                    document.getElementById('last-update').innerText = "Ruch: " + item.timestamp;
                }
            });
        });

        map.on('click', e => console.log(`"${currentFloorId}": [${Math.round(e.latlng.lat)}, ${Math.round(e.latlng.lng)}]`));
    </script>
</body>
</html>
